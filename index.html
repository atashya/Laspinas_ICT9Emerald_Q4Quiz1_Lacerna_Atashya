<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Body Mass Index Calculator</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #ffe6f2;
            color: #333;
        }
        .container {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 120vh;
        }
        .right-side {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 80%;
        }
        .btn-custom {
            background-color: #ff99cc;
            color: white;
            padding: 10px 20px;
            font-size: 1.2rem;
        }
        .btn-custom:hover {
            background-color: #ff66b2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-8 right-side">
                <h2 class="text-center">BMI Calculator</h2>
                <p>Enter your weight and height in order to calculate your BMI </p>
                <button class="btn btn-custom" onclick="instructions.toggle()">Instructions</button>
                <p id="instructions" style="display:none;">BMI categories are standardiezed classifications used to assess weight status on an individuals height and weight measured in kilogram per square meter (kg/m)
</p>
                <form onsubmit="calculateBMI(); return false;">
                    <div class="mb-3">
                        <label for="weight" class="form-label">Weight kilogram</label>
                        <input type="number" id="weight" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label for="height" class="form-label">Height meter</label>
                        <input type="number" step="0.01" id="height" class="form-control" required>
                    </div>
                    <button type="submit" class="btn btn-custom">Calculate BMI</button>
                </form>
                <h3 id="result" class="mt-3"></h3>
            </div>
        </div>
    </div>
    <script>
        let instructions = document.getElementById("instructions");
        instructions.toggle = function() {
            this.style.display = this.style.display === "none" ? "block" : "none";
        };

        function calculateBMI() {
            let weight = parseFloat(document.getElementById("weight").value);
            let height = parseFloat(document.getElementById("height").value);
            let bmi = weight / Math.pow(height, 2);
            let category = "";

            if (bmi < 18.5) {
                category = "Underweight";
            } else if (bmi >= 18.5 && bmi <= 24.9) {
                category = "Normal weight";
            } else if (bmi >= 25 && bmi <= 29.9) {
                category = "Overweight";
            } else {
                category = "Obese";
            }

            document.getElementById("result").innerHTML = `Your BMI is ${bmi.toFixed(2)} (${category}).`;
        }
    </script>
</body>
</html>
